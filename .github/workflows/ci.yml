name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.24.x", "stable"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          go version
          go mod download
          go mod verify
          go test -count=1 ./...

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - name: Race
        shell: bash
        run: |
          set -euo pipefail
          go test -race -count=1 ./...

  vet-and-module:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true
      - name: Vet and module
        shell: bash
        run: |
          set -euo pipefail
          go vet ./...
          go mod tidy -diff
          git diff --exit-code -- go.mod go.sum

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true
      - name: Coverage
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/check-coverage.sh

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true
      - name: govulncheck
        shell: bash
        run: |
          set -euo pipefail
          go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
